name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        continue-on-error: false

      - name: Terraform Init (modules only)
        run: |
          cd modules/platform/k8s/cluster && terraform init -backend=false

      - name: Terraform Validate (cluster module)
        run: |
          cd modules/platform/k8s/cluster && terraform validate


  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint GitOps manifests
        run: yamllint gitops/ -c .yamllint.yaml

      - name: Lint Templates
        run: yamllint templates/node/deployment/ -c .yamllint.yaml

  kustomize:
    name: Kustomize Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Validate rendered ApplicationSets (dev)
        run: |
          kustomize build --enable-helm --load-restrictor LoadRestrictionsNone gitops/clusters/dev \
            | kubeconform \
                --schema-location default \
                --schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                --strict

      - name: Validate rendered ApplicationSets (prod)
        run: |
          kustomize build --enable-helm --load-restrictor LoadRestrictionsNone gitops/clusters/prod \
            | kubeconform \
                --schema-location default \
                --schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                --strict

      - name: Build Node template overlay (dev)
        run: kustomize build templates/node/deployment/overlays/dev
