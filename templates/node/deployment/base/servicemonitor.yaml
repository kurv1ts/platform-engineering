apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ${{ values.serviceFullName }}
  labels:
    app: ${{ values.serviceFullName }}
    team: ${{ values.team }}
    app.kubernetes.io/name: ${{ values.serviceFullName }}
    app.kubernetes.io/managed-by: argocd
spec:
  selector:
    matchLabels:
      app: ${{ values.serviceFullName }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 10s
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: team
          replacement: ${{ values.team }}

