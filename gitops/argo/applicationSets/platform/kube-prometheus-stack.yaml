apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-kube-prometheus-stack
  namespace: argocd
  labels:
    owner: platform
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
spec:
  generators:
    - list:
        elements:
          - cluster: default
            name: kube-prometheus-stack
            namespace: observability
            chart: kube-prometheus-stack
            repo: https://prometheus-community.github.io/helm-charts
            version: "80.13.3"

  template:
    metadata:
      name: "{{name}}"
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: platform

      sources:
        - repoURL: "{{repo}}"
          chart: "{{chart}}"
          targetRevision: "{{version}}"
          helm:
            skipCrds: true # CRDs are managed by separate applicationSet
            valueFiles:
              - $values/gitops/apps/platform/observability/kube-prometheus-stack/values/values.yaml
        - repoURL: git@github.com:kurv1ts/platform-engineering.git
          targetRevision: main
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            owner: platform
            app.kubernetes.io/part-of: platform
            app.kubernetes.io/managed-by: argocd
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
