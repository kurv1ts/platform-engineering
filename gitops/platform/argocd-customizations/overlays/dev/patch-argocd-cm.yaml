apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # Custom health check for Ingresses with traefik-dev ingressClassName.
  # In dev, traefik runs as ClusterIP (no load balancer), so the standard
  # ArgoCD health check would permanently report Progressing.
  resource.customizations.health.networking.k8s.io_Ingress: |
    hs = {}
    if obj.spec.ingressClassName == "traefik-dev" then
      hs.status = "Healthy"
      hs.message = "Ingress is managed by traefik-dev (ClusterIP)"
      return hs
    end
    if obj.status ~= nil and obj.status.loadBalancer ~= nil and obj.status.loadBalancer.ingress ~= nil and #obj.status.loadBalancer.ingress > 0 then
      hs.status = "Healthy"
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for load balancer address"
    return hs
