apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: serviceaccount-token-disabled
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
  validations:
    - expression: "object.automountServiceAccountToken == false"
      message: "ServiceAccounts must set automountServiceAccountToken: false"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: serviceaccount-token-disabled
spec:
  policyName: serviceaccount-token-disabled
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: owner
          operator: NotIn
          values: ["platform", "backstage"]
