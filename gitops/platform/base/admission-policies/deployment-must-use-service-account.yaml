apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: deployment-must-use-serviceaccount
  labels:
    owner: platform
    app.kubernetes.io/part-of: platform
    app.kubernetes.io/managed-by: argocd
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  validations:
    - expression: "object.spec.template.spec.serviceAccountName != ''"
      message: "Deployments must specify serviceAccountName"
    - expression: "object.spec.template.spec.serviceAccountName != 'default'"
      message: "Default ServiceAccount is forbidden"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: deployment-must-use-serviceaccount
spec:
  policyName: deployment-must-use-serviceaccount
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: owner
          operator: NotIn
          values: ["platform", "backstage"]