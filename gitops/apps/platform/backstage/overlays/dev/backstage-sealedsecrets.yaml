---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: backstage-secrets
  namespace: backstage-dev
spec:
  encryptedData:
    BACKEND_SECRET: 
    DOCKER_TOKEN: 
    GITHUB_CLIENT_ID: 
    GITHUB_CLIENT_SECRET: 
    GITHUB_TOKEN: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: argocd
        app.kubernetes.io/part-of: platform
        owner: platform
      name: backstage-secrets
      namespace: backstage-dev
    type: Opaque
